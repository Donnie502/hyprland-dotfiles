remember_window_size no
initial_window_width  640
initial_window_height 400

# --- Apariencia ---
font_family      JetBrainsMono Nerd Font
font_size        11.0

background_opacity 0.85
dynamic_background_opacity yes

window_padding_width 10

# Colores generados dinamicamente por wallust, ver ~/.config/kitty/colors.conf
include colors.conf

# --- Copiar/pegar como en GNOME ---
# Ctrl+C copia si hay seleccion; si no, manda la interrupcion de
# siempre al proceso. Ctrl+Shift+C/V siguen funcionando igual.
map ctrl+c copy_and_clear_or_interrupt
map ctrl+v paste_from_clipboard
